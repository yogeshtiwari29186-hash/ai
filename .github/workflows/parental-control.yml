name: Build Parent and Child APKs

on:
  push:
    paths:
      - 'parental-control/**'
      - '.github/workflows/parental-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy Firebase config to both modules
        run: cp parental-control/parent/google-services.json parental-control/child/google-services.json
      - name: Build both debug APKs
        working-directory: parental-control
        run: gradle --no-daemon :parent:assembleDebug :child:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: parental-control-apks
          path: |
            parental-control/parent/build/outputs/apk/debug/parent-debug.apk
            parental-control/child/build/outputs/apk/debug/child-debug.apk
          if-no-files-found: error
          retention-days: 14
